[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "btt_cloud_mask_example"
version = "0.1.0"
description = "Reference cloud masks for Maxar Open Data imagery from prebuilt models (OmniCloudMask, ukis-csmask, CloudSEN12)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack Savage" }]
keywords = ["cloud detection", "remote sensing", "stac", "satellite imagery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omnicloudmask>=1.7",
    "pystac>=1.8",
    "rasterio>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
ukis = ["ukis-csmask[cpu]>=1.0"]
cloudsen12 = ["cloudsen12_models>=1.0"]
all = ["btt_cloud_mask_example[ukis,cloudsen12]"]
dev = ["pytest>=8", "build", "twine"]

[project.scripts]
cloud-detect = "btt_cloud_mask_example.cli:main"

[project.urls]
Homepage = "https://github.com/jeckseveg/example-cloud-detector-package"
Issues = "https://github.com/jeckseveg/example-cloud-detector-package/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/btt_cloud_mask_example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
